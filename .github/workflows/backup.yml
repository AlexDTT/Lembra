name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'
permissions:
  contents: read
jobs:
  backup:
    # Production backups belong in an explicitly enabled private repository.
    if: github.event.repository.private == true && vars.ENABLE_DATABASE_BACKUPS == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Require backup configuration
        run: test -n "$SUPABASE_DB_URL" && test -n "$BACKUP_ENCRYPTION_KEY"
      - name: Dump with PostgreSQL 17 and encrypt
        run: |
          mkdir backups
          docker run --rm -e SUPABASE_DB_URL postgres:17 sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-acl' > backups/lembra.sql
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output backups/lembra.sql.gpg backups/lembra.sql
          rm backups/lembra.sql
      - uses: actions/upload-artifact@v4
        with:
          name: lembra-encrypted-backup-${{ github.run_id }}
          path: backups/lembra.sql.gpg
          retention-days: 90
          if-no-files-found: error
